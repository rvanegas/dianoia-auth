[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth"
version = "0.1.0"
description = "The one sign-in for rvanegas.co's projects."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "mcp>=2.3,<3",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
auth = "auth.server:main"

[tool.setuptools]
packages = ["auth"]

[tool.setuptools.package-data]
auth = ["deployed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
